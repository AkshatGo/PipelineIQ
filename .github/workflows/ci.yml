name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @pipelineiq/shared
      - run: npm run build --workspace @pipelineiq/frontend
      - run: npm run lint --workspace @pipelineiq/shared
      - run: npm run lint --workspace @pipelineiq/frontend
      - run: npm run test --workspace @pipelineiq/shared
      - run: npm run test --workspace @pipelineiq/frontend

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
